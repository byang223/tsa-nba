<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Over/Under Challenge 2026-27</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1b1b1a;--mut:#6b6a66;--bd:#e3e1da;--ac:#c8102e;--ok:#1a7f4b;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#efeee9;--mut:#9b9a94;--bd:#33332f;--ac:#ff5a6e;--ok:#4cc38a;--bad:#ff8077;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#efeee9;--mut:#9b9a94;--bd:#33332f;--ac:#ff5a6e;--ok:#4cc38a;--bad:#ff8077;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:26px 0 8px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
tr.bot td{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid.m{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media(max-width:480px){.grid.m{grid-template-columns:1fr}}
.big{font-size:17px;font-weight:600}
.chip{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.o{color:var(--ok);font-weight:600}.u{color:var(--bad);font-weight:600}
input[type=range]{width:min(360px,100%);vertical-align:middle}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
</style></head><body><main>
<h1>🏀 NBA Over/Under Challenge</h1>
<div class="mut" id="st"></div>
<div class="card" style="margin-top:10px"><label class="mut">Demo season preview — games played: <b id="gv">0</b></label><br>
<input type="range" id="sl" min="0" max="82" value="0"> <span class="mut">(0 = live data)</span></div>

<h2>Leaderboard</h2>
<div class="card scroll"><table><thead><tr><th>#</th><th>Manager</th><th title="Clinched hits + decided bonuses">Locked pts</th><th title="Pace-based hits + all bonuses">Projected pts</th><th title="Tiebreaker: signed win differential">Net wins</th><th>Nuggets</th></tr></thead><tbody id="lb"></tbody></table></div>
<div class="mut" style="margin-top:6px">Bottom three (shaded) owe their nugget count. Projected uses current win pace; Locked only counts mathematically decided picks.</div>

<h2>Bonus races</h2><div class="grid" id="bn"></div>
<h2>Portfolios</h2><div class="grid m" id="pf"></div>
</main>
<script>
let T={OKC:["Thunder",61.5],SAS:["Spurs",60.5],NYK:["Knicks",52.5],BOS:["Celtics",50.5],PHI:["76ers",50.5],CLE:["Cavaliers",48.5],DET:["Pistons",48.5],DEN:["Nuggets",48.5],MIN:["Timberwolves",47.5],HOU:["Rockets",47.5],TOR:["Raptors",46.5],MIA:["Heat",45.5],LAL:["Lakers",45.5],IND:["Pacers",43.5],ATL:["Hawks",43.5],ORL:["Magic",43.5],POR:["Trail Blazers",41.5],PHX:["Suns",39.5],CHA:["Hornets",38.5],UTA:["Jazz",37.5],GSW:["Warriors",37.5],WAS:["Wizards",34.5],DAL:["Mavericks",33.5],CHI:["Bulls",29.5],MEM:["Grizzlies",29.5],LAC:["Clippers",28.5],NOP:["Pelicans",28.5],MIL:["Bucks",25.5],BKN:["Nets",24.5],SAC:["Kings",20.5]};
// name, nugget target, picks in draft order (first two = Phase 1 exclusive, 2 pts)
const M=[["Tony",35,"MIA O,CLE O,WAS O,IND O,PHX U"],["John",35,"HOU O,TOR O,ATL U,IND O,ORL O"],["Mark",51,"WAS U,UTA O,PHI U,LAL U,ATL U"],["SYP",25,"MEM O,BKN O,PHI U,SAS U,POR U"],["Elliot",40,"DET O,DEN O,NOP O,MIL U,IND O"],["Kevin",35,"LAL O,BOS U,PHI U,LAC U,WAS O"],["Jessica",30,"SAC O,OKC U,BOS O,NOP O,MIL O"],["Bryan",35,"CHA U,SAS O,LAC U,PHX U,ORL O"],["Hank",50,"DAL O,NOP U,POR O,OKC O,ORL U"],["Vivian",28,"NYK O,CHA O,CHI O,SAS U,IND U"],["Jerry",50,"GSW U,PHI O,BOS O,MIN U,SAS U"]];
let ms=M.map(([n,nug,p])=>({n,nug,picks:p.split(",").map((x,i)=>{const[t,s]=x.split(" ");return{t,o:s==="O",ph:i<2?2:1}})}));
// standings.json (optional, same folder): {"asOf":"2027-01-05","teams":{"OKC":[30,8]},"decided":{"OKC":"2027-03-20"}}
let LS={},LD={},S={},D={},asOf="";
const $=s=>document.querySelector(s),r6=x=>Math.round(x*1e6)/1e6,sg=x=>(x>0?"+":"")+x.toFixed(1);
function info(t,over){const line=T[t][1],r=S[t]||[0,0],w=r[0],l=r[1],g=w+l,maxW=82-l;
 const hit=over?w>line:maxW<line,miss=over?maxW<line:w>line;
 const proj=g?w/g*82:line,net=over?proj-line:line-proj;
 return{line,w,l,g,proj,net,hit,miss,pHit:net>0}}
function render(){
 const aO=new Set,aU=new Set;ms.forEach(m=>m.picks.forEach(p=>(p.o?aO:aU).add(p.t)));
 const best=(set,over)=>{let b=0,ts=[];set.forEach(t=>{const n=r6(info(t,over).net);if(n>b){b=n;ts=[t]}else if(n===b&&n>0)ts.push(t)});return{b,ts}};
 const ap=best(aO,true),ab=best(aU,false);
 const first=k=>{let d=null;ms.forEach(m=>m.picks.forEach(p=>{if(info(p.t,p.o)[k]&&D[p.t]&&(!d||D[p.t]<d))d=D[p.t]}));
  return{d,hs:d?ms.filter(m=>m.picks.some(p=>info(p.t,p.o)[k]&&D[p.t]===d)).map(m=>m.n):[]}};
 const fc=first("hit"),fx=first("miss");
 const rows=ms.map(m=>{let lk=0,pj=0,net=0,bon=0;
  m.picks.forEach(p=>{const i=info(p.t,p.o),pts=p.ph;if(i.hit)lk+=pts;if(i.pHit)pj+=pts;net+=i.net;
   if(p.o&&ap.ts.includes(p.t))bon++;if(!p.o&&ab.ts.includes(p.t))bon++});
  const cb=(fc.hs.includes(m.n)?1:0)+(fx.hs.includes(m.n)?1:0);
  return{m,lk:lk+cb,pj:pj+bon+cb,net:r6(net)}}).sort((a,b)=>b.pj-a.pj||b.net-a.net);
 const g0=Object.values(S).reduce((a,r)=>a+r[0]+r[1],0);
 $("#st").textContent=g0?(asOf?"Standings as of "+asOf:"Demo standings (simulated)"):"Season hasn't tipped off — all teams 0-0. Drag the slider to preview scoring.";
 $("#lb").innerHTML=rows.map((x,i)=>`<tr class="${i>=rows.length-3?"bot":""}"><td>${i+1}</td><td><b>${x.m.n}</b></td><td>${x.lk}</td><td>${x.pj}</td><td>${sg(x.net)}</td><td>${x.m.nug}</td></tr>`).join("");
 const holders=(ts,over)=>ms.filter(m=>m.picks.some(p=>p.o===over&&ts.includes(p.t))).map(m=>m.n).join(", ")||"—";
 const card=(h,a,b)=>`<div class="card"><div class="mut">${h}</div><div class="big">${a}</div><div class="mut">${b}</div></div>`;
 $("#bn").innerHTML=card("Apex Over (biggest boom)",ap.ts.join(", ")||"—",ap.ts.length?sg(ap.b)+" wins vs line · "+holders(ap.ts,true):"no Over ahead of its line")
  +card("Abyss Under (biggest bust)",ab.ts.join(", ")||"—",ab.ts.length?sg(ab.b)+" wins under line · "+holders(ab.ts,false):"no Under ahead of its line")
  +card("First to Clinch",fc.d?lbl(fc.d):"none yet",fc.hs.join(", ")||"waiting on first locked pick")
  +card("First Eliminated",fx.d?lbl(fx.d):"none yet",fx.hs.join(", ")||"waiting on first dead pick");
 $("#pf").innerHTML=rows.map(x=>`<div class="card"><div class="mh"><b>${x.m.n}</b><span class="mut">${x.lk} locked · ${x.pj} proj · ${sg(x.net)}</span></div><div class="scroll"><table><thead><tr><th>Pick</th><th>Pts</th><th>Line</th><th>W-L</th><th>Pace</th><th></th></tr></thead><tbody>${x.m.picks.map(p=>{const i=info(p.t,p.o);
  const st=i.hit?'<span class="chip ok">✓ locked</span>':i.miss?'<span class="chip bad">✗ dead</span>':'<span class="chip">live</span>';
  return`<tr><td>${p.t} <span class="${p.o?"o":"u"}">${p.o?"OVER":"UNDER"}</span></td><td>${p.ph}</td><td>${i.line}</td><td>${i.w}-${i.l}</td><td class="${i.g?(i.pHit?"ok":"bad"):""}">${i.g?sg(i.net):"—"}</td><td>${st}</td></tr>`}).join("")}</tbody></table></div></div>`).join("");
}
function demo(g){const s={};for(const t in T){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%97;
 const w=Math.max(0,Math.min(g,Math.round(g*(T[t][1]/82+(h/97-.5)*.3))));s[t]=[w,g-w]}return s}
function demoD(v){const d={};for(let g=1;g<=v;g++){const s=demo(g);for(const t in T){if(d[t])continue;const[w,l]=s[t],L=T[t][1];if(w>L||82-l<L)d[t]=g}}return d}
const lbl=d=>typeof d=="number"?"after game "+d:d;
$("#sl").oninput=e=>{const v=+e.target.value;$("#gv").textContent=v;if(v){S=demo(v);D=demoD(v);asOf=""}else{S=LS;D=LD;asOf=LAsOf}render()};
let LAsOf="";
fetch("standings.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{LS=S=j.teams||{};LD=D=j.decided||{};LAsOf=asOf=j.asOf||"";render()}).catch(()=>{});
// league.json (optional, same folder) overrides the embedded lines and picks
fetch("league.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{const t={};for(const k in j.teams)t[k]=[j.teams[k].name,j.teams[k].line];T=t;ms=j.managers.map(m=>({n:m.name,nug:m.nuggets,picks:m.picks.map((p,i)=>({t:p.team,o:p.side==="over",ph:i<2?2:1}))}));render()}).catch(()=>{});
render();
</script></body></html>
